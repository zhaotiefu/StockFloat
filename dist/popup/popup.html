<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stock Float</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="app">
      <header class="header">
        <div>
          <div class="brand">STOCK FLOAT</div>
          <div class="subtitle">A 股行情悬浮窗</div>
        </div>
        <button id="refreshBtn" class="ghost-btn" type="button">手动刷新</button>
      </header>

      <section class="card">
        <h2>自选股票</h2>
        <form id="addForm" class="add-form">
          <input
            id="symbolInput"
            type="text"
            inputmode="numeric"
            maxlength="6"
            placeholder="输入 6 位代码，如 601318"
            autocomplete="off"
          />
          <button type="submit">添加</button>
        </form>
        <p id="formError" class="error" hidden></p>
        <ul id="watchlist" class="watchlist"></ul>
        <p id="emptyHint" class="hint">还没有自选股票，添加一只开始盯盘。</p>
      </section>

      <section class="card">
        <h2>设置</h2>
        <label class="row">
          <span>悬浮窗启用</span>
          <input id="enabled" type="checkbox" />
        </label>
        <p class="hint page-tip">
          开启后会弹出独立白色悬浮窗，切换到任意页面（含 chrome://）都可继续显示。
          <br />若关闭了窗口，重新勾选「悬浮窗启用」即可再次打开。
        </p>
        <label class="row">
          <span>透明度 <em id="opacityValue">85%</em></span>
          <input id="opacity" type="range" min="20" max="100" step="1" />
        </label>
        <label class="row">
          <span>刷新间隔</span>
          <select id="refreshInterval">
            <option value="2">2 秒（推荐盯盘）</option>
            <option value="5">5 秒</option>
            <option value="10">10 秒</option>
            <option value="30">30 秒</option>
          </select>
        </label>
        <label class="row">
          <span>显示股票代码</span>
          <input id="showSymbol" type="checkbox" />
        </label>
        <label class="row">
          <span>显示更新时间</span>
          <input id="showUpdateTime" type="checkbox" />
        </label>
        <label class="row">
          <span>默认最小化</span>
          <input id="minimized" type="checkbox" />
        </label>
        <button id="resetPosition" class="secondary-btn" type="button">
          重置悬浮窗到右下角
        </button>
      </section>

      <footer class="footer">
        <span id="statusLine">就绪</span>
      </footer>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
